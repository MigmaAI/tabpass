<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow site access</title>
    <link rel="stylesheet" href="../sidepanel/panel.css" />
    <style>
      main {
        min-height: 100vh;
        align-content: center;
        gap: 16px;
        padding: 24px;
      }
      #title {
        font-size: 18px;
        line-height: 1.3;
      }
      #url {
        overflow-wrap: anywhere;
      }
      .stack {
        display: grid;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stack">
        <img src="../icons/icon-48.png" alt="" width="32" height="32" />
        <h1 id="title">Allow this agent to use this site?</h1>
        <p class="hint" id="what"></p>
        <p class="hint" id="url"></p>
      </div>
      <div class="stack" id="buttons"></div>
      <div class="actions">
        <button type="button" class="btn ghost small danger" data-decision="block">Block this site</button>
        <button type="button" class="btn ghost small" data-decision="all">Allow every site</button>
      </div>
      <p class="hint" id="gone" hidden>This request is no longer waiting. You can close this window.</p>
    </main>
    <script type="module" src="prompt.js"></script>
  </body>
</html>
