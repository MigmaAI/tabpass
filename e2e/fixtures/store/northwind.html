<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Studio — Spring collection</title>
    <meta name="description" content="A made-up brand page for the Tabpass store screenshots." />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f6f1ea; color: #2b2622; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; }
      .logo { font: 700 18px/1 Georgia, serif; letter-spacing: 0.04em; }
      nav { display: flex; gap: 22px; font-size: 13px; color: #6b625a; }
      .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding: 28px 40px 36px; }
      .kicker { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #b4532a; }
      h1 { font: 400 46px/1.05 Georgia, serif; margin: 12px 0 14px; letter-spacing: -0.01em; }
      p { font-size: 15px; line-height: 1.6; color: #5a524b; max-width: 30ch; }
      .cta { display: inline-block; margin-top: 20px; background: #2b2622; color: #f6f1ea; padding: 12px 22px; border-radius: 999px; font-size: 14px; }
      .art { height: 260px; border-radius: 18px; background: #d9c6b0; position: relative; overflow: hidden; }
      .art i { position: absolute; border-radius: 50% 50% 46% 46%; }
      .art .a { width: 120px; height: 150px; left: 60px; bottom: 30px; background: #b4532a; }
      .art .b { width: 90px; height: 190px; left: 170px; bottom: 30px; background: #efe6da; border-radius: 40px 40px 30px 30px; }
      .art .c { width: 110px; height: 110px; left: 250px; bottom: 30px; background: #6f7d6a; }
      .art .shelf { left: 30px; right: 30px; bottom: 18px; height: 12px; border-radius: 6px; background: #8a6f57; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 0 40px 40px; }
      .card { background: #fffaf3; border-radius: 14px; padding: 12px; }
      .card div { height: 96px; border-radius: 10px; margin-bottom: 10px; }
      .card b { display: block; font-size: 14px; }
      .card span { font-size: 13px; color: #7a7068; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">NORTHWIND</div>
      <nav><span>Shop</span><span>Journal</span><span>Studio</span><span>Cart (0)</span></nav>
    </header>
    <section class="hero">
      <div>
        <div class="kicker">Spring collection</div>
        <h1>Made slowly, by hand.</h1>
        <p>Stoneware glazed in small batches, in colours taken from the coast.</p>
        <span class="cta">Shop the collection</span>
      </div>
      <div class="art" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="shelf"></i></div>
    </section>
    <section class="grid">
      <div class="card"><div style="background: #b4532a"></div><b>Ember vase</b><span>$64</span></div>
      <div class="card"><div style="background: #6f7d6a"></div><b>Moss bowl</b><span>$38</span></div>
      <div class="card"><div style="background: #d9c6b0"></div><b>Sand pitcher</b><span>$52</span></div>
    </section>
  </body>
</html>
