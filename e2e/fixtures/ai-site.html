<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Some AI tool</title>
  </head>
  <body>
    <!-- A third-party website that supports the Tabpass Web Protocol (docs/web-protocol.md). -->
    <h1>Some AI tool</h1>
    <button id="connect">Connect your browser</button>
    <button id="status">Check</button>
    <button id="disconnect">Disconnect</button>
    <pre id="silent"></pre>
    <pre id="result"></pre>
    <script type="module">
      import { connect, hello, status, disconnect } from "/tabpass-connect.js";
      const show = (value) => (document.getElementById('result').textContent = JSON.stringify(value));
      // A silent probe on load, with no click: Tabpass must not answer an unknown site.
      hello({ timeoutMs: 1000 }).then(
        (result) => (document.getElementById('silent').textContent = 'answered ' + JSON.stringify(result)),
        () => (document.getElementById('silent').textContent = 'no answer')
      );
      document.getElementById('connect').onclick = () => connect({ name: 'Some AI tool', access: 'read' }).then(show, (error) => show({ error: error.code }));
      document.getElementById('status').onclick = () => status().then(show, (error) => show({ error: error.message }));
      document.getElementById('disconnect').onclick = () => disconnect().then(show, (error) => show({ error: error.message }));
    </script>
  </body>
</html>
